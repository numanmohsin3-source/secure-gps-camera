name: Build Protected GPS Camera APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK (API 35)
        run: |
          SDK_MANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)
          echo "Using sdkmanager: $SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null 2>&1 || true
          "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace || true

      - name: Generate signing keystore if secrets not set
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias gpscam \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android123 -keypass android123 \
              -dname "CN=GPS Map Camera, O=SecureGPS, C=PK"
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=android123" >> $GITHUB_ENV
            echo "KEY_ALIAS=gpscam" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android123" >> $GITHUB_ENV
          fi

      - name: Build Debug and Release APKs
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Build Play Store App Bundle (AAB)
        continue-on-error: true
        run: gradle bundleRelease --no-daemon --stacktrace || gradle bundle --no-daemon --stacktrace || true

      - name: Upload Release APK (R8 Obfuscated & Signed)
        uses: actions/upload-artifact@v4
        with:
          name: GPS-Map-Camera-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Play Store App Bundle (AAB)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: GPS-Map-Camera-PlayStore-AAB
          path: app/build/outputs/bundle/release/*.aab

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GPS-Map-Camera-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
